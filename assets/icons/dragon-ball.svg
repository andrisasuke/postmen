<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ball background with gradient -->
  <defs>
    <radialGradient id="ballGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFB347"/>
      <stop offset="50%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Main ball -->
  <circle cx="50" cy="50" r="45" fill="url(#ballGradient)" stroke="#CC5500" stroke-width="2"/>

  <!-- Shine effect -->
  <ellipse cx="35" cy="35" rx="15" ry="12" fill="url(#shine)"/>

  <!-- 4 Stars -->
  <circle cx="35" cy="35" r="6" fill="#B22222"/>
  <circle cx="65" cy="35" r="6" fill="#B22222"/>
  <circle cx="35" cy="60" r="6" fill="#B22222"/>
  <circle cx="65" cy="60" r="6" fill="#B22222"/>
</svg>
