[package]
name = "postmen"
version = "0.1.0"
edition = "2021"
description = "Dragon Ball themed REST API Client"
authors = ["PostMen Team"]

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
thiserror = "1.0"
image = "0.25"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
muda = "0.11.3"

[profile.release]
opt-level = 3
lto = true

[package.metadata.bundle]
name = "PostMen"
identifier = "com.postmen.app"
icon = ["assets/icons/AppIcon.icns"]
category = "Developer Tool"
short_description = "Dragon Ball themed REST API Client"
long_description = "A Dragon Ball themed REST API client for testing and debugging APIs"
